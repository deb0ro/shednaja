# Fast checks without a build, a printer or the stock firmware. The full system test is
# rootfs/tests/offline_check.sh after a build (docs/rootfs-build.md).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck (errors)
        run: |
          # every tracked shell script: by shebang, plus the sourced profile.d snippets
          git ls-files -z | while IFS= read -r -d '' f; do
            if [ -f "$f" ] && head -n 1 "$f" | grep -qE '^#!.*(/sh|bash)'; then printf '%s\0' "$f"; fi
          done > scripts
          git ls-files -z 'rootfs/board/kobra_s1/overlay/etc/profile.d/*.sh' >> scripts
          xargs -0 shellcheck --severity=error < scripts

      - name: python syntax
        run: git ls-files -z '*.py' rootfs/board/kobra_s1/overlay/usr/libexec/kobra/helix-defaults |
          xargs -0 python3 -m py_compile

      - name: kobra-abctl
        run: bash rootfs/package/kobra-abctl/test/unit_test.sh

      - name: kobra_plr
        run: python3 -m unittest discover -s rootfs/tests -p 'test_*.py' -v

      - name: kobra-config-migrate
        run: bash rootfs/tests/test_config_migrate.sh

      - name: Armbian loader A/B (host busybox)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static xxd > /dev/null
          bash armbian_build/loader/test_ab.sh
