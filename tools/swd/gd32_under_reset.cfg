# Manual "connect under reset" for when the firmware disables/remaps the SWD pins.
# The probe has no NRST line, so NRST (P7 pad 5) is held to GND (pad 2) by hand:
#   1. short P7 pad 5 to pad 2 and keep it shorted
#   2. run: openocd -c "set PROBE cmsis-dap" -f tools/swd/gd32_under_reset.cfg -c "set OUT dumps/mcu" -c "connect_under_reset"
#   3. when it prints RELEASE NRST NOW, remove the short
# The core then halts on its reset vector (vector catch) before the firmware runs,
# and the same read-only probe/dump as gd32_readonly.cfg is done.

source [file join [file dirname [info script]] gd32_readonly.cfg]

proc connect_under_reset {} {
    echo "Waiting for the debug port (hold NRST low now)..."
    # init does not raise when the DP is silent, so retry the DAP + examine explicitly
    catch {init}
    set ok 0
    for {set i 0} {$i < 180} {incr i} {
        if {![catch {dap init}] && ![catch {stm32f1x.cpu arp_examine}]} { set ok 1; break }
        sleep 500
    }
    if {!$ok} { echo "No SWD response within 90 s – check wiring."; shutdown; return }

    # DHCSR: DBGKEY | C_DEBUGEN ; DEMCR: TRCENA | VC_CORERESET
    mww 0xE000EDF0 0xA05F0001
    mww 0xE000EDFC 0x01000001
    echo ">>> RELEASE NRST NOW (remove the pad 5 – pad 2 short) <<<"

    set halted 0
    for {set i 0} {$i < 60} {incr i} {
        if {![catch {set dhcsr [read_memory 0xE000EDF0 32 1]}] && (($dhcsr >> 17) & 1)} { set halted 1; break }
        sleep 500
    }
    if {!$halted} { echo "Core did not halt on reset vector – continuing anyway." } else { echo "Core halted on reset vector." }

    # skip the second init inside probe_and_dump
    proc init {} {}
    probe_and_dump
}
