# Read-only SWD probe + flash dump of the Kobra S1 motion MCU (GigaDevice "GD32FCES RBT6").
# Never erases, unlocks or writes anything. Does not halt the core.
#
#   openocd -c "set PROBE cmsis-dap" -f tools/swd/gd32_readonly.cfg -c "set OUT dumps/mcu" -c "probe_and_dump"
#
# PROBE: cmsis-dap (Raspberry Pi Debug Probe, default) or stlink.
# Board must be powered from its own 24 V supply; the probe only provides GND, SWDIO, SWCLK.

if {![info exists PROBE]} { set PROBE cmsis-dap }
source [find interface/$PROBE.cfg]
transport select swd
adapter speed 1000

# GD32 parts report a non-ST TAP id -> accept any
set CPUTAPID 0
set WORKAREASIZE 0x2000
source [find target/stm32f1x.cfg]

reset_config none

proc hex32 {v} { return [format 0x%08X $v] }

proc probe_and_dump {} {
    global OUT
    if {![info exists OUT]} { set OUT "dumps/mcu" }
    init

    set idcode  [read_memory 0xE0042000 32 1]
    set cpuid   [read_memory 0xE000ED00 32 1]
    set fsize   [read_memory 0x1FFFF7E0 16 1]
    set uid     [read_memory 0x1FFFF7E8 32 3]
    set obr     [read_memory 0x4002201C 32 1]
    set wrpr    [read_memory 0x40022020 32 1]
    set optb    [read_memory 0x1FFFF800 32 4]

    set rdp [expr {($obr >> 1) & 1}]
    set flash_bytes [expr {$fsize * 1024}]

    set fp [open "${OUT}_info.txt" w]
    foreach line [list \
        "DBGMCU_IDCODE  [hex32 $idcode]" \
        "CPUID          [hex32 $cpuid]" \
        "FLASH_SIZE     $fsize KB" \
        "UID            [hex32 [lindex $uid 0]] [hex32 [lindex $uid 1]] [hex32 [lindex $uid 2]]" \
        "FLASH_OBR      [hex32 $obr]  (RDP active = $rdp)" \
        "FLASH_WRPR     [hex32 $wrpr]" \
        "OPTION_BYTES   [hex32 [lindex $optb 0]] [hex32 [lindex $optb 1]] [hex32 [lindex $optb 2]] [hex32 [lindex $optb 3]]" \
    ] {
        echo $line
        puts $fp $line
    }

    if {$rdp} {
        set msg "RDP is active: flash is not readable over SWD. NOT unlocking (that would mass-erase). Stop here."
        echo $msg
        puts $fp $msg
        close $fp
        shutdown
        return
    }

    echo "Dumping $flash_bytes bytes of flash to ${OUT}_flash.bin ..."
    dump_image "${OUT}_flash.bin" 0x08000000 $flash_bytes
    # GD32 often has more physical flash than marked; grab the next 128 KB too (may fail harmlessly)
    if {[catch {dump_image "${OUT}_flash_beyond.bin" [expr {0x08000000 + $flash_bytes}] 0x20000} err]} {
        echo "Beyond-size read failed (expected on some parts): $err"
    }
    dump_image "${OUT}_sysmem.bin" 0x1FFFF000 0x800
    puts $fp "Flash dumped: ${OUT}_flash.bin"
    close $fp
    echo "Done."
    shutdown
}
