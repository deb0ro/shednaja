# Write a Klipper application image into the APP1 slot (0x08008000, max 40 KiB) of the
# Kobra S1 motion MCU over SWD, leaving the Anycubic bootloader (0x08000000-0x08007FFF),
# OTA staging (0x08012000), factory area (0x0801C000), OTA record (0x0801E000) and the
# board-ID page (0x0801F800) untouched. Uses manual connect-under-reset like
# gd32_under_reset.cfg (hold P7 pad 5 NRST to pad 2 GND until told to release).
#
#   openocd -c "set PROBE cmsis-dap" -c "set IMG build/mcu/klipper.bin" -f tools/swd/gd32_flash_app.cfg -c "flash_app"
#
# Restore stock: set IMG to the APP1 part of the original dump (see docs/mcu-flash-test.md).

source [file join [file dirname [info script]] gd32_readonly.cfg]

set APP1      0x08008000
set APP1_SIZE 0xA000

proc flash_app {} {
    global IMG APP1 APP1_SIZE
    set size [file size $IMG]
    if {$size > $APP1_SIZE} { echo "image $size B > APP1 slot $APP1_SIZE B - abort"; shutdown; return }

    echo "Waiting for the debug port (hold NRST low now)..."
    catch {init}
    set ok 0
    for {set i 0} {$i < 180} {incr i} {
        if {![catch {dap init}] && ![catch {stm32f1x.cpu arp_examine}]} { set ok 1; break }
        sleep 500
    }
    if {!$ok} { echo "No SWD response - check wiring."; shutdown; return }
    mww 0xE000EDF0 0xA05F0001
    mww 0xE000EDFC 0x01000001
    echo ">>> RELEASE NRST NOW <<<"
    for {set i 0} {$i < 60} {incr i} {
        if {![catch {set d [read_memory 0xE000EDF0 32 1]}] && (($d >> 17) & 1)} break
        sleep 500
    }
    halt

    # erase only the 2 KiB pages covered by the image, inside APP1
    set first [expr {($APP1 - 0x08000000) / 0x800}]
    set last  [expr {$first + ($size + 0x7FF) / 0x800 - 1}]
    echo "erasing flash pages $first..$last ([format 0x%08X $APP1] + $size B)"
    flash erase_sector 0 $first $last
    flash write_image $IMG $APP1 bin
    verify_image $IMG $APP1 bin
    echo "APP1 written and verified. Remove power or reset to run."
    mww 0xE000EDFC 0x00000000
    shutdown
}
