# ShedNaja: Mainsail (static) on port 80, Moonraker API/websocket proxied to 7125.
server.modules = ( "mod_access", "mod_rewrite", "mod_proxy" )

server.document-root  = "/usr/share/mainsail"
server.port           = 80
server.username       = "www-data"
server.groupname      = "www-data"
server.pid-file       = "/run/lighttpd.pid"
server.errorlog       = "/useremain/shednaja/printer_data/logs/lighttpd-error.log"
index-file.names      = ( "index.html" )
server.tag            = "shednaja"

# Uploads (gcode files can be large): stream request bodies to Moonraker instead of
# buffering them, and if lighttpd ever needs a temp file use flash, not the RAM /tmp.
server.stream-request-body  = 2
server.stream-response-body = 2
server.upload-dirs          = ( "/useremain/shednaja/tmp" )
server.max-request-size     = 0

# The Mainsail websocket can stay silent from the browser side for over a minute; with the
# default max-read-idle of 60 s lighttpd dropped it every ~62 s and Mainsail reconnected.
server.max-read-idle  = 3600
server.max-write-idle = 3600

mimetype.assign = (
    ".html" => "text/html",
    ".js" => "text/javascript",
    ".mjs" => "text/javascript",
    ".css" => "text/css",
    ".json" => "application/json",
    ".webmanifest" => "application/manifest+json",
    ".map" => "application/json",
    ".svg" => "image/svg+xml",
    ".png" => "image/png",
    ".jpg" => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".gif" => "image/gif",
    ".ico" => "image/x-icon",
    ".webp" => "image/webp",
    ".woff" => "font/woff",
    ".woff2" => "font/woff2",
    ".ttf" => "font/ttf",
    ".txt" => "text/plain",
    ".gz" => "application/gzip",
    "" => "application/octet-stream"
)

# Moonraker endpoints (same set as Mainsail's nginx config)
$HTTP["url"] =~ "^/(websocket|printer|api|access|machine|server)(/|$|\?)" {
    proxy.server    = ( "" => ( ( "host" => "127.0.0.1", "port" => 7125 ) ) )
    proxy.header    = ( "upgrade" => "enable" )
    proxy.forwarded = ( "for" => 1, "proto" => 1, "host" => 1 )
}
# Camera: mjpg-streamer (S65webcam) on 127.0.0.1:8080, /webcam/?action=stream|snapshot
else $HTTP["url"] =~ "^/webcam/" {
    proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8080 ) ) )
    proxy.header = ( "map-urlpath" => ( "/webcam/" => "/" ) )
}
else $HTTP["url"] =~ "^/" {
    # single-page app: everything that is not a file goes to index.html
    url.rewrite-if-not-file = ( "^/[^?]*(\?.*)?$" => "/index.html$1" )
}
