# Camera/ISP/NPU/codec modules from the RV1106 SDK config are in /lib/modules, but the
# printer camera is UVC on USB and nothing uses these. Keep mdev's modalias coldplug
# (S10mdev) from loading them (they also reserve CMA memory).
blacklist video_rkisp
blacklist video_rkcif
blacklist phy_rockchip_csi2_dphy
blacklist phy_rockchip_csi2_dphy_hw
blacklist rknpu
blacklist rga3
blacklist rve
blacklist rk_dvbm
blacklist sc3336
blacklist sc4336
blacklist sc530ai
blacklist gc2053
blacklist os04a10
blacklist imx415
blacklist sc200ai
blacklist sc401ai
blacklist sc450ai
