# Anycubic Kobra S1 - ShedNaja (Klipper running on the printer's own host board)
#
# This file is yours: ShedNaja copies it to printer_data/config only on first boot
# and never overwrites it. SAVE_CONFIG writes its results to the end of this file.
#
# Files (ShedNaja defaults, plain Klipper, no Anycubic firmware shims):
#  - kobra_s1.cfg: hardware (pins/steppers/heaters/fans/probe as in the stock GoKlipper
#    config FW 2.7.2.7, checked pin by pin, see docs/rootfs-build.md "Step 2")
#  - kobra_macros.cfg: PRINT_START / PRINT_END, filament load/unload/runout, nozzle wipe,
#    purge bin, cutter; slicer start G-code: PRINT_START BED=... EXTRUDER=...
#  - kobra_peripherals.cfg: host-board light and buzzer (Linux MCU)
#  - mainsail.cfg: mainsail-crew/mainsail-config (PAUSE / RESUME / CANCEL_PRINT)
#  - MCU ports: /dev/ttyS3 (mcu) and /dev/ttyS5 (nozzle_mcu) at 576000 baud, both MCUs on
#    the Kobra-S1 Klipper fork firmware (mcu v2.0.12, nozzle_mcu v2.0.13).

[include mainsail.cfg]
[include kobra_s1.cfg]
[include kobra_macros.cfg]
[include kobra_peripherals.cfg]

[mcu]
serial: /dev/ttyS3
restart_method: command
baud: 576000

[mcu nozzle_mcu]
serial: /dev/ttyS5
restart_method: command
baud: 576000

[virtual_sdcard]
path: /useremain/shednaja/printer_data/gcodes

# --- printer-specific values -------------------------------------------------------
# Starting values from the stock GoKlipper calibration of the test printer
# (/userdata/app/gk/printer_mutable.cfg). Re-run PID_CALIBRATE / SHAPER_CALIBRATE on
# your printer; SAVE_CONFIG then overrides these. All values SAVE_CONFIG may write
# (PID, input shaper, z_offset) live only here, not in kobra_s1.cfg: Klipper refuses
# to SAVE_CONFIG options that an included file also sets.
[extruder]
pid_Kp: 19.812
pid_Ki: 0.905
pid_Kd: 108.473

[heater_bed]
pid_Kp: 34.536
pid_Ki: 0.564
pid_Kd: 528.395

[input_shaper]
shaper_type_x: 3hump_ei
shaper_freq_x: 84.8
shaper_type_y: mzv
shaper_freq_y: 43.0

# z_offset: stock GoKlipper used -0.0825 with its own probe module. probe_ks1 / the
# load-cell probe may measure differently, so it starts at 0:
# do a paper test / PROBE_CALIBRATE before the first print.
[probe_ks1]
z_offset: 0
