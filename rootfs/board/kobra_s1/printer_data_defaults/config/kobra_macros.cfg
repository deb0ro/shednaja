# Anycubic Kobra S1 - macros (ShedNaja). Included from printer.cfg.
#
# Plain Klipper: no Anycubic slicer shims (G9111, M204 P/T, M900, bedTemp=...).
# Slicer start G-code:  PRINT_START BED=<bed> EXTRUDER=<nozzle>
# Slicer end G-code:    PRINT_END
# PAUSE / RESUME / CANCEL_PRINT come from mainsail.cfg; _CLIENT_VARIABLE below parks
# them in front of the purge bin.
#
# The S1 specific bits are only fixed toolhead positions at the back of the bed:
#   purge bin   X48  Y276   (purged filament drops out of the printer)
#   blade       X48  Y255   (knocks the purged blob off the nozzle)
#   wiper       X72..X96 Y273 (silicone strip)
#   cutter      X261 Y12    (front right, pushed by moving toward Y0)

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 48.0
variable_custom_park_y    : 250.0
variable_custom_park_dz   : 3.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 48.0
variable_park_at_cancel_y : 250.0
variable_runout_sensor    : "filament_switch_sensor filament_runout_nozzle"
variable_user_cancel_macro: "_FANS_OFF"
gcode:

# --- print start / end --------------------------------------------------------------

[gcode_macro PRINT_START]
description: Heat, home, clean the nozzle, adaptive bed mesh, purge line
# BED, EXTRUDER: temperatures (C). PROBE_TEMP: nozzle temperature for wiping and probing,
# hot enough to keep residue soft, too cold to ooze. PURGE: mm of filament pushed into the
# purge bin before wiping (0 = skip).
gcode:
  {% set BED = params.BED|default(60)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(220)|float %}
  {% set PROBE_TEMP = params.PROBE_TEMP|default(140)|float %}
  {% set PURGE = params.PURGE|default(30)|float %}
  CLEAR_PAUSE
  BED_MESH_CLEAR
  M107
  M140 S{BED}
  M104 S{PROBE_TEMP}
  G90
  G28
  {% if PURGE > 0 %}
    # fresh filament at the nozzle, blob into the bin
    _PARK_BIN
    _NOZZLE_WAIT TEMP={EXTRUDER}
    M83
    G1 E{PURGE} F300
    G1 E-1 F1800
    _KNOCK_OFF
  {% endif %}
  # wipe on the silicone strip while the nozzle cools to probing temperature
  M106 S255
  _WIPE_NOZZLE
  _NOZZLE_WAIT TEMP={PROBE_TEMP}
  _WIPE_NOZZLE
  M107
  # M190 also waits for the bed to settle within 1 C; an overshoot to 71.3 C on a 70 C
  # target held the first print for minutes. Warm enough is enough.
  M140 S{BED}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED - 1}
  {% if BED > 80 %}
    # the S1 bed still bends for a while after reaching a high temperature
    G4 P180000
  {% endif %}
  G28 Z
  BED_MESH_CALIBRATE ADAPTIVE=1
  # heat to print temperature over the wiper, then prime along the front edge
  _HEAT_POS
  _NOZZLE_WAIT TEMP={EXTRUDER}
  _PURGE_LINE

[gcode_macro PRINT_END]
description: Retract, park at the purge bin, heaters and fans off. CUT=1 also cuts the filament
gcode:
  {% set CUT = params.CUT|default(0)|int %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set z = [printer.toolhead.position.z + 3, max_z]|min %}
  M83
  G1 E-1 F1800
  G90
  G1 Z{z} F600
  {% if CUT %}
    CUT_TIP
  {% endif %}
  _PARK_BIN
  TURN_OFF_HEATERS
  M107
  _FANS_OFF
  M84

# --- power-loss recovery ---------------------------------------------------------
# kobra_plr saves the print state at every layer change (the slicer's layer-change G-code
# must call SET_PRINT_STATS_INFO CURRENT_LAYER=..., as the ShedNaja OrcaSlicer profile does).
# After a power cut, RESUME_INTERRUPTED continues the print from the start of the layer it
# stopped in: bed heat, X/Y homing above the print, nozzle purge and wipe, Z measured with
# the probe next to the print, then the file continues. See klippy/extras/kobra_plr.py.
[kobra_plr]

[gcode_macro RESUME_INTERRUPTED]
description: Resume a print interrupted by a power cut (asks first). PROBE=0 skips the Z check, PURGE=mm
gcode:
  _RESUME_INTERRUPTED {rawparams}

[gcode_macro CLEAR_INTERRUPTED]
description: Discard the saved state of an interrupted print
gcode:
  _CLEAR_INTERRUPTED

[gcode_macro _NOZZLE_WAIT]
description: Set the nozzle temperature and wait until it is within +-WINDOW (default 3) C
# M109 also waits for the temperature to settle (slope < 0.1 C/s); with the part fan on
# that took minutes or never happened in the first test print.
gcode:
  {% set t = params.TEMP|float %}
  {% set w = params.WINDOW|default(3)|float %}
  M104 S{t}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={t - w} MAXIMUM={t + w}

[gcode_macro _FANS_OFF]
description: Auxiliary and air filter fans off
gcode:
  SET_FAN_SPEED FAN=box_fan SPEED=0
  SET_FAN_SPEED FAN=air_filter_fan SPEED=0

# --- filament -----------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Heat (TEMP, default: current target or 230 C), feed 80 mm into the purge bin
gcode:
  {% set target = printer.extruder.target|float %}
  {% set TEMP = params.TEMP|default(target if target >= 170 else 230)|float %}
  {% set LENGTH = params.LENGTH|default(80)|float %}
  SAVE_GCODE_STATE NAME=_load
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _PARK_BIN
  _NOZZLE_WAIT TEMP={TEMP}
  M83
  G1 E{LENGTH} F300
  G1 E-1 F1800
  _KNOCK_OFF
  RESTORE_GCODE_STATE NAME=_load

[gcode_macro UNLOAD_FILAMENT]
description: Heat (TEMP, default 230 C), cut the filament and pull it out of the extruder
gcode:
  {% set target = printer.extruder.target|float %}
  {% set TEMP = params.TEMP|default(target if target >= 170 else 230)|float %}
  SAVE_GCODE_STATE NAME=_unload
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _NOZZLE_WAIT TEMP={TEMP}
  CUT_TIP
  M83
  G1 E-100 F1200
  RESTORE_GCODE_STATE NAME=_unload

# runout/insert of the toolhead sensor ([adc_filament_switch] in kobra_s1.cfg).
# On runout the sensor already PAUSEs the print.
[gcode_macro _RUNOUT]
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    M300 P500
    RESPOND TYPE=error MSG="Filament runout: print paused. Insert filament (it is loaded automatically), then RESUME."
  {% endif %}

[gcode_macro _INSERT]
gcode:
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Filament inserted: loading, then RESUME the print."
    LOAD_FILAMENT
  {% else %}
    RESPOND MSG="Filament inserted. Run LOAD_FILAMENT to feed it to the nozzle."
  {% endif %}

[gcode_macro CUT_TIP]
description: Cut the filament with the cutter at the front right (toolhead pushes the lever)
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  SAVE_GCODE_STATE NAME=_cut
  G90
  G1 X230 Y240 F12000
  G1 X261 Y12.5 F12000
  G1 Y0.5 F600
  G4 P80
  M400
  FORCE_MOVE STEPPER=extruder DISTANCE=-2 VELOCITY=10
  FORCE_MOVE STEPPER=extruder DISTANCE=2 VELOCITY=10
  FORCE_MOVE STEPPER=extruder DISTANCE=-2 VELOCITY=10
  G1 X251 F12000
  G1 Y248 F12000
  G1 X48 F12000
  _PARK_BIN
  FORCE_MOVE STEPPER=extruder DISTANCE=2 VELOCITY=10
  RESTORE_GCODE_STATE NAME=_cut

# --- fixed toolhead positions -------------------------------------------------------

[gcode_macro _PARK_BIN]
description: Nozzle over the purge bin
gcode:
  G90
  G1 X48 F12000
  G1 Y230 F12000
  G1 Y250 F12000
  G1 Y276 F12000

[gcode_macro _KNOCK_OFF]
description: Knock the purged blob off at the blade, cool it, shake it loose
gcode:
  _PARK_BIN
  G1 Y255 F3000
  G4 P500
  _PARK_BIN
  M106 S255
  G4 P1000
  G91
  G1 X40 F20000
  G1 X-40 F20000
  G1 X40 F20000
  G1 X-40 F20000
  G90
  _PARK_BIN
  M107

[gcode_macro _WIPE_NOZZLE]
description: Scrub the nozzle on the silicone strip at the back
gcode:
  G90
  G1 Y250 F12000
  G1 X81 F8000
  G1 Y273 F8000
  {% for i in range(14) %}
    G1 X96 F8000
    G1 X81 F8000
  {% endfor %}
  G1 X72 F8000
  G1 X77 F8000
  G1 X72 F8000
  G1 X77 F8000
  G1 X75 F8000

[gcode_macro _HEAT_POS]
description: Nozzle over the wiper, catches ooze while heating
gcode:
  G90
  G1 Y250 F12000
  G1 X100 F12000
  G1 Y269 F12000
  G1 X75 F12000

[gcode_macro _PURGE_LINE]
description: Prime line along the front edge
gcode:
  G90
  M83
  G0 X5 Y4 F7200
  G1 Z0.3 F1200
  G1 X150 E6 F1200
  G1 Y5 E0.6 F1200
  G1 X5 E6 F1200
  G1 Z1 F1200

# --- slicer fan commands ------------------------------------------------------------
# OrcaSlicer: M106 P2 = auxiliary fan (box_fan), M106 P3 = air filter / exhaust.
[gcode_macro M106]
rename_existing: M106.1
gcode:
  {% set p = params.P|default(0)|int %}
  {% set s = [[params.S|default(255)|float, 0]|max, 255]|min %}
  {% if p == 2 %}
    SET_FAN_SPEED FAN=box_fan SPEED={s / 255}
  {% elif p == 3 %}
    SET_FAN_SPEED FAN=air_filter_fan SPEED={s / 255}
  {% else %}
    M106.1 S{s}
  {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:
  {% set p = params.P|default(0)|int %}
  {% if p == 2 %}
    SET_FAN_SPEED FAN=box_fan SPEED=0
  {% elif p == 3 %}
    SET_FAN_SPEED FAN=air_filter_fan SPEED=0
  {% else %}
    M107.1
  {% endif %}

# --- setup / calibration wizard (re-runnable) ---------------------------------------
# SHEDNAJA_SETUP opens a dialog in Mainsail with the calibration steps; each step can be run
# again at any time. Results are collected and written by "Save & restart" (SAVE_CONFIG).
# The display has the same tools under Settings > Calibration & Tools (HelixScreen).

[gcode_macro SHEDNAJA_SETUP]
description: Calibration wizard: PID, Z offset, input shaper, bed mesh (re-runnable)
variable_done: ''
gcode:
  {% set d = printer["gcode_macro SHEDNAJA_SETUP"].done.split(',') %}
  RESPOND TYPE=command MSG="action:prompt_begin ShedNaja setup"
  RESPOND TYPE=command MSG="action:prompt_text Run the steps in order (each can be repeated). Steps 3-5 home the printer; keep the bed clear. Nothing is stored until 'Save and restart'."
  RESPOND TYPE=command MSG="action:prompt_button {'[done] ' if 'pid_nozzle' in d else ''}1. Nozzle PID (240 C)|_SETUP_STEP STEP=pid_nozzle|primary"
  RESPOND TYPE=command MSG="action:prompt_button {'[done] ' if 'pid_bed' in d else ''}2. Bed PID (70 C)|_SETUP_STEP STEP=pid_bed|primary"
  RESPOND TYPE=command MSG="action:prompt_button {'[done] ' if 'z_offset' in d else ''}3. Z offset (paper test)|_SETUP_STEP STEP=z_offset|primary"
  RESPOND TYPE=command MSG="action:prompt_button {'[done] ' if 'shaper' in d else ''}4. Input shaper (resonances)|_SETUP_STEP STEP=shaper|primary"
  RESPOND TYPE=command MSG="action:prompt_button {'[done] ' if 'mesh' in d else ''}5. Bed mesh (bed at 60 C)|_SETUP_STEP STEP=mesh|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_SETUP_CLOSE"
  RESPOND TYPE=command MSG="action:prompt_footer_button Save and restart|_SETUP_STEP STEP=save|warning"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SETUP_CLOSE]
gcode:
  RESPOND TYPE=command MSG=action:prompt_end

[gcode_macro _SETUP_STEP]
gcode:
  {% set step = params.STEP %}
  {% set done = printer["gcode_macro SHEDNAJA_SETUP"].done %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if step == "save" %}
    SAVE_CONFIG
  {% else %}
    {% if step == "pid_nozzle" %}
      M107
      PID_CALIBRATE HEATER=extruder TARGET=240
    {% elif step == "pid_bed" %}
      PID_CALIBRATE HEATER=heater_bed TARGET=70
    {% elif step == "z_offset" %}
      RESPOND MSG="Z offset: the nozzle cools to 140 C, then use the paper test in the Manual Probe dialog and ACCEPT. Run SHEDNAJA_SETUP again afterwards."
      M140 S60
      _NOZZLE_WAIT TEMP=140
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=59
      G28
      _WIPE_NOZZLE
      G28 Z
      PROBE_CALIBRATE
    {% elif step == "shaper" %}
      G28
      SHAPER_CALIBRATE
    {% elif step == "mesh" %}
      M140 S60
      _NOZZLE_WAIT TEMP=140
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=59
      G28
      _WIPE_NOZZLE
      G28 Z
      BED_MESH_CALIBRATE
    {% endif %}
    SET_GCODE_VARIABLE MACRO=SHEDNAJA_SETUP VARIABLE=done VALUE="'{done},{step}'"
    {% if step not in ["z_offset"] %}
      TURN_OFF_HEATERS
      SHEDNAJA_SETUP
    {% endif %}
  {% endif %}
