# ShedNaja: peripherals wired to the host board (RV1106), not to the MCUs.
# See docs/peripherals.md. Included from printer.cfg.
#
# Stock GoKlipper drives these itself ([led_pin] gpio:117, [pause_resume] bee_path
# /sys/class/pwm/pwmchip0/pwm0/enable). Vanilla Klipper has no host pins without a
# "Linux MCU": klipper_mcu (started by /etc/init.d/S59klipper-mcu before klippy)
# serves them on /tmp/klipper_host_mcu. Everything on the main board and the
# toolhead (fans, filament sensors) is configured in kobra_s1.cfg.

[mcu host]
serial: /tmp/klipper_host_mcu

# REBOOT_TO_STOCK: restart into the stock Anycubic firmware in slot A (with a
# confirmation dialog). See klippy/extras/kobra_slot.py.
[kobra_slot]

[gcode_macro REBOOT_TO_STOCK]
description: Restart into the stock Anycubic firmware (slot A)
gcode:
  _REBOOT_TO_STOCK {rawparams}

# Chamber / toolhead-area LED light: GPIO3_C5 (sysfs gpio117), active high.
[output_pin chamber_light]
pin: host:gpiochip3/gpio21
value: 1
shutdown_value: 0

# Buzzer: PWM0 (GPIO1_A2) on the host board. A fixed tone, M300 switches it on and off.
[output_pin beeper]
pin: host:pwmchip0/pwm0
pwm: True
hardware_pwm: True
cycle_time: 0.0004
value: 0
shutdown_value: 0

[gcode_macro LIGHT_ON]
description: Chamber light on
gcode:
    SET_PIN PIN=chamber_light VALUE=1

[gcode_macro LIGHT_OFF]
description: Chamber light off
gcode:
    SET_PIN PIN=chamber_light VALUE=0

[gcode_macro LIGHT_TOGGLE]
description: Toggle the chamber light
gcode:
    SET_PIN PIN=chamber_light VALUE={0 if printer["output_pin chamber_light"].value else 1}

# M300 [P<duration ms>]: beep (the tone is fixed by the buzzer, S is ignored)
[gcode_macro M300]
description: Beep
gcode:
    {% set ms = params.P|default(100)|int %}
    SET_PIN PIN=beeper VALUE=0.5
    G4 P{ms}
    SET_PIN PIN=beeper VALUE=0
