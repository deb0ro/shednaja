# Anycubic Kobra S1 - hardware (ShedNaja). Included from printer.cfg.
#
# Pins, steppers, TMC2209, heaters, thermistors, fans, load cell, probe and accelerometer
# are the values of the stock GoKlipper printer.cfg (FW 2.7.2.7), checked pin by pin
# (docs/rootfs-build.md "Step 2"; first taken over from Kobra-S1/vanilla-klipper-swu).
# Macros are in kobra_macros.cfg. Values that SAVE_CONFIG may change (PID, input shaper,
# probe z_offset) are only in printer.cfg: Klipper refuses to SAVE_CONFIG an option that
# an included file also sets. MCU serial ports are in printer.cfg too.

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
square_corner_velocity: 15.0
max_z_velocity: 15
max_z_accel: 1000

# --- motion -------------------------------------------------------------------------
[stepper_x]
step_pin: PB12
dir_pin: PA7
enable_pin: !PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: !PA8
position_endstop: -6
position_min: -6
position_max: 265
homing_speed: 30
second_homing_speed: 80
homing_retract_dist: 0

[stepper_y]
step_pin: PA5
dir_pin: PA4
enable_pin: !PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
endstop_pin: PA11
position_endstop: 0
position_min: 0
position_max: 277
homing_speed: 30
second_homing_speed: 80
homing_retract_dist: 0

[stepper_z]
step_pin: PB14
dir_pin: PB13
enable_pin: !PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 2.66666666666666666
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 253
homing_speed: 6
second_homing_speed: 3
homing_retract_dist: 4

[tmc2209 stepper_x]
uart_pin: PA3
uart_address: 3
run_current: 1.5
hold_current: 0.75
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: True
driver_SGTHRS: 80
diag_pin: PA6
driver_MULTISTEP_FILT: False

[tmc2209 stepper_y]
uart_pin: PA3
uart_address: 1
run_current: 1.5
hold_current: 0.75
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: True
driver_SGTHRS: 80
diag_pin: PA12
driver_MULTISTEP_FILT: False

[tmc2209 stepper_z]
uart_pin: PA3
uart_address: 2
run_current: 1.6
hold_current: 0.8
sense_resistor: 0.075
stealthchop_threshold: 0
interpolate: True
driver_MULTISTEP_FILT: False

# Homing: Y, then X (endstops), then Z with the load-cell probe in the bed centre.
# The travel to the centre runs at 1000 mm/s^2 like stock safe_z_home (home_accel);
# with the full max_accel it shook the whole printer.
[homing_override]
axes: xyz
gcode:
  {% set REQX = 'X' in params or 'x' in params %}
  {% set REQY = 'Y' in params or 'y' in params %}
  {% set REQZ = 'Z' in params or 'z' in params %}
  {% if not REQX and not REQY and not REQZ %}
    {% set REQX = True %}{% set REQY = True %}{% set REQZ = True %}
  {% endif %}
  {% set Z_HOP = 6 %}
  {% set RUN_ACCEL = printer.toolhead.max_accel %}
  SAVE_GCODE_STATE NAME=_homing
  {% if 'z' not in printer.toolhead.homed_axes %}
    # lift before homing XY: Z is unknown, pretend it is 0 for the hop. Only Z is marked
    # homed for the move (SET_KINEMATIC_POSITION alone marks x, y and z), and it is
    # cleared again unless Z gets homed below, so a G28 X does not leave a fake Z.
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    G91
    G0 Z{Z_HOP} F480
    G90
    {% if not REQZ %}
      # SET_HOMED= (empty): without it the command marks x, y and z homed first
      SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% endif %}
  {% endif %}
  {% set HOME_X = REQX or (REQZ and 'x' not in printer.toolhead.homed_axes) %}
  # X always after Y, as in a full G28: a plain G28 X with the head at another Y position
  # ran it into the left side of the frame without triggering the X switch (2026-10-22).
  {% set HOME_Y = HOME_X or REQY or (REQZ and 'y' not in printer.toolhead.homed_axes) %}
  {% if HOME_Y %}
    G28 Y
  {% endif %}
  {% if HOME_X %}
    G28 X
  {% endif %}
  {% if REQZ %}
    SET_VELOCITY_LIMIT ACCEL=1000
    G90
    G0 X125 Y125 F7200
    G28 Z
    G91
    G0 Z{Z_HOP} F480
    G90
    SET_VELOCITY_LIMIT ACCEL={RUN_ACCEL}
  {% endif %}
  RESTORE_GCODE_STATE NAME=_homing MOVE=0

# --- load-cell probe (CS1237 strain gauge on the nozzle MCU) ------------------------
[cs1237]
level_pin: nozzle_mcu:PA7
dout_pin: nozzle_mcu:PA6
sclk_pin: nozzle_mcu:PA5
register: 60
sensitivity: -2500
head_block_sensitivity: -300000
scratch_sensitivity: -100000
self_check_sensitivity: -400
block_filament_sensitivity: -3000

[probe_ks1]
pin: PB15
x_offset: 0
y_offset: 0
speed: 3.0
final_speed: 4.0
lift_speed: 3.0
samples: 3
sample_retract_dist: 3
samples_result: median
samples_tolerance: 0.04
samples_tolerance_retries: 20

[bed_mesh]
speed: 300
horizontal_move_z: 3
mesh_min: 5, 5
mesh_max: 245, 245
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
split_delta_z: 0.0125
fade_start: 1
fade_end: 10
# areas the nozzle must not probe: frame clips, bed pins, cutter corner
faulty_region_1_min: 0.0, 253.0
faulty_region_1_max: 25.0, 258.0
faulty_region_2_min: 70.0, 254.0
faulty_region_2_max: 76.0, 260.0
faulty_region_3_min: 180.0, 254.0
faulty_region_3_max: 186.0, 260.0
faulty_region_4_min: 233.0, 253.0
faulty_region_4_max: 258.0, 258.0
faulty_region_5_min: 250.0, 0.0
faulty_region_5_max: 258.0, 30.0

# --- extruder and bed ---------------------------------------------------------------
[extruder]
step_pin: nozzle_mcu:PA12
dir_pin: !nozzle_mcu:PA11
enable_pin: !nozzle_mcu:PC13
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 6.5756
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 50
max_extrude_only_distance: 1200.0
heater_pin: nozzle_mcu:PB8
sensor_type: NTC ZM3486 HNS112HC4570G0060Y3486
sensor_pin: nozzle_mcu:PA0
control: pid
# stock printer.cfg has -180 / -200; a realistic minimum lets min_temp catch an open or
# disconnected thermistor (it then reads far below room temperature)
min_temp: -10
max_temp: 340
min_extrude_temp: 170
pressure_advance: 0.03

[tmc2209 extruder]
uart_pin: nozzle_mcu:PA3
uart_address: 3
run_current: 0.6
hold_current: 0.3
sense_resistor: 0.075
stealthchop_threshold: 99999
interpolate: True
driver_SEMIN: 15
driver_SEUP: 3
driver_SEMAX: 15
driver_SEDN: 3
driver_SEIMIN: 1
driver_MULTISTEP_FILT: False

[heater_bed]
heater_pin: PA0
sensor_type: NTC 100K beta 3950
sensor_pin: PC0
control: pid
min_temp: -10
max_temp: 140

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 1

[verify_heater heater_bed]
max_error: 120
check_gain_time: 300
hysteresis: 5
heating_gain: 1

# --- fans ---------------------------------------------------------------------------
[fan]
pin: nozzle_mcu:PB6
cycle_time: 0.005
hardware_pwm: True

[heater_fan extruder_fan]
pin: nozzle_mcu:PB9

[controller_fan controller_fan]
pin: PB5
fan_speed: 1
idle_speed: 0
idle_timeout: 30

# auxiliary (side) part-cooling fan: M106 P2 from the slicer
[fan_generic box_fan]
pin: PC6
cycle_time: 0.00003333333
hardware_pwm: True

# air filter / exhaust: M106 P3 from the slicer
[fan_generic air_filter_fan]
pin: PC7
cycle_time: 0.00003333333
hardware_pwm: True

# --- sensors ------------------------------------------------------------------------
# Toolhead runout sensor: a spring-loaded swing piece below the extruder gears, read by an
# analog sensor: about 2.66 V when filament has been fed through the extruder, 2.93 V
# without (both logic high), so it is read through the ADC (klippy/extras/
# adc_filament_switch.py). Filament that only reaches the gears is not detected yet.
# runout_gcode / insert_gcode are in kobra_macros.cfg ([gcode_macro _RUNOUT] / _INSERT).
[adc_filament_switch filament_runout_nozzle]
switch_pin: nozzle_mcu:PB0
threshold: 2.78
present_above: False
pause_on_runout: True
runout_gcode: _RUNOUT
insert_gcode: _INSERT
event_delay: 3.0
pause_delay: 0.5

# ACE Pro return detection module at the back (only used with an ACE Pro)
[filament_switch_sensor filament_runout_rdm]
switch_pin: PB0
pause_on_runout: False

[lis2dw12]
cs_pin: nozzle_mcu:PB12
spi_speed: 1000000
# hardware SPI2 (PB13/PB14/PB15) as in the stock printer.cfg; the Anycubic MCU firmware
# v1.4.3 returns 0xff over software SPI on these pins
spi_bus: spi2
rate: 400
axes_map: x, z, y

[resonance_tester]
accel_chip: lis2dw12
probe_points: 127, 127, 20
min_freq: 1
max_freq: 140
accel_per_hz: 150
hz_per_sec: 2

# --- Klipper features ---------------------------------------------------------------
[input_shaper]

[exclude_object]

[gcode_arcs]
resolution: 1.0

[force_move]
enable_force_move: True

[idle_timeout]
timeout: 3600
