# ShedNaja camera settings, read by /etc/init.d/S65webcam: KEY=value lines (read as data,
# not run as a script; a value that does not fit is ignored, see the kernel log).
# Apply with: /etc/init.d/S65webcam restart (or reboot).
# The stream is at http://<printer>/webcam/?action=stream (snapshot: ?action=snapshot).

# 0 = do not start the camera stream
WEBCAM_ENABLE=1
WEBCAM_DEVICE=/dev/video0
# The built-in camera (SunplusIT 13d3:784b) delivers MJPEG itself, so mjpg-streamer
# uses almost no CPU. It sends about 20 fps (requested rates are "coerced"), ~250 kB per
# frame at 1280x720 (the camera's JPEG quality is fixed). The printer's Wi-Fi is the limit:
# with power saving off (/etc/modprobe.d/kobra-wifi.conf) one viewer gets 15-20 fps at
# 1280x720; every further viewer shares the bandwidth. 640x480 (~100 kB) keeps 20 fps on a
# weak link. HelixScreen also shows the stream on the display and decodes it on the
# printer's single CPU: at 1280x720 that took ~45 % CPU (100 % in total with Moonraker), so
# 640x480 is the default. Resolutions the camera offers: 640x480, 960x720, 1280x720.
# 15 fps: with the stream open at 30 fps the CPU was close to 100 %.
WEBCAM_RESOLUTION=640x480
WEBCAM_FPS=15
# extra input_uvc options, e.g. "-rot 180" or "-q 80"
WEBCAM_OPTIONS=""
