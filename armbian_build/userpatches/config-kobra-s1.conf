# ./compile.sh kobra-s1  (reads this file). See armbian_build/README.md.
BOARD=kobra-s1
BRANCH=vendor              # Rockchip BSP 6.1 (armbian/linux-rockchip rk-6.1-rkr7.2)
RELEASE=trixie             # Debian 13
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
KERNEL_GIT=shallow
INSTALL_HEADERS=no
EXTRAWIFI=no               # rtl8723ds comes as a userpatch, the harness drivers are not needed
COMPRESS_OUTPUTIMAGE=sha
SHARE_LOG=no               # never upload build logs
NETWORKING_STACK=none        # no netplan/networkd/resolved: busybox udhcpc (kobra-dhcp@.service), ~6 MB RAM
# armbian-firmware is 525 MB of /usr/lib/firmware; the RTL8723DS Wi-Fi firmware is inside
# 8723ds.ko, the BT firmware will come from the stock update (README, open items)
INSTALL_ARMBIAN_FIRMWARE=no
# fixed rootfs size, no auto-resize: the root later lives in a directory, not this image
FIXED_IMAGE_SIZE=1536
