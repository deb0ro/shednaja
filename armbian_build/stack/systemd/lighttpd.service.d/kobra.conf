# as ShedNaja's S62lighttpd: log dir and Moonraker's upload temp dir on useremain
[Unit]
After=useremain-shednaja.mount
# the data copy must be mounted: without it /useremain/shednaja is Lite's own data
RequiresMountsFor=/useremain/shednaja

[Service]
ExecStartPre=/bin/mkdir -p /useremain/shednaja/printer_data/logs /useremain/shednaja/tmp
ExecStartPre=/bin/chown www-data:www-data /useremain/shednaja/tmp
